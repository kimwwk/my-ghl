services:
  invoices:
    build: .
    image: my-ghl:local
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # Open to the local network. The web UI has no login: anyone who can reach this port can use it.
    ports:
      - "8796:8796"
